name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Release Notes
        shell: bash
        run: |
          # 1. Extract version from tag (v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF_NAME#v}
          
          # 2. Extract section from CHANGELOG.md using awk (more robust than sed)
          echo "## What's New" > release-notes.md
          # Escape brackets for awk regex: requires triple backslash logic in YAML/Bash context often, 
          # but simplisticly: \\\[ matches literal \[ in awk when passed inside double quotes
          awk "/^## \\[$VERSION\\]/{p=1;print;next} /^## \[/{p=0} p" CHANGELOG.md >> release-notes.md
          
          # 3. Add Full Commit Log
          echo -e "\n## Full Changelog (Commits)" >> release-notes.md
          
          # Try to find the previous tag relative to HEAD (ignoring the current tag)
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "Listing all commits (First Release):"
            git log --pretty=format:"- %s (%h)" >> release-notes.md
          else
            echo "Listing commits from $PREV_TAG to HEAD:"
            git log "$PREV_TAG..HEAD" --pretty=format:"- %s (%h)" >> release-notes.md
          fi
          
          # Debug: Print notes to console
          cat release-notes.md

      - name: Build and Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run dist -- --publish always --config.releaseInfo.releaseNotesFile=release-notes.md
