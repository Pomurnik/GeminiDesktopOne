name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Release Notes
        shell: bash
        run: |
          # 1. Extract version from tag (v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF_NAME#v}
          
          # 2. Extract section from CHANGELOG.md
          # Assuming standard Keep A Changelog format: "## [1.0.0]"
          echo "## What's New" > release-notes.md
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' >> release-notes.md
          
          # 3. Add Full Commit Log
          echo -e "\n## Full Changelog (Commits)" >> release-notes.md
          git log $(git describe --tags --abbrev=0 ^HEAD 2>/dev/null || echo "")--HEAD --pretty=format:"- %s (%h)" >> release-notes.md
          
          # Debug: Print notes to console
          cat release-notes.md

      - name: Build and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run dist -- --publish always -c.releaseInfo.releaseNotesFile=release-notes.md
