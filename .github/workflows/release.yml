name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Release Notes
        shell: bash
        run: |
          # 1. Extract version from tag (v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF_NAME#v}
          
          # 2. Extract section from CHANGELOG.md using awk
          echo "## What's New" > release-notes.md
          # Relaxed regex: match '##' followed by any characters, then '[VERSION]'
          awk "/^## .*\[$VERSION\]/{p=1;print;next} /^## \[/{p=0} p" CHANGELOG.md >> release-notes.md
          
          # 3. Add Full Changelog Link
          echo -e "\n**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" >> release-notes.md
          
          # Debug: Print notes to console
          cat release-notes.md

      - name: Build (No Publish)
        shell: bash
        run: npm run dist -- --publish never

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: release-notes.md
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
